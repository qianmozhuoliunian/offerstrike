# Keep the installer identity stable for existing installations.
appId: com.offerpilot.workbench
productName: OfferStrike
asar: true
directories:
  output: dist/windows
files:
  - desktop/**
  - public/assets/offerstrike-icon.png
  - src/ai-transport.js
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
extraResources:
  - from: dist/python/OfferStrikeBackend
    to: backend
    filter:
      - '**/*'
win:
  icon: public/assets/offerstrike.ico
  signExecutable: false
  target:
    - nsis
    - zip
nsis:
  artifactName: OfferStrike-Setup.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
