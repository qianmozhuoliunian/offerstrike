# Keep the installer identity stable for existing installations.
appId: com.offerpilot.workbench
productName: OfferStrike
asar: true
directories:
  output: dist/windows
files:
  - desktop/**
  - public/**
  - src/**
  - server.js
  - package.json
  - LICENSE
win:
  icon: public/assets/offerstrike.ico
  signExecutable: false
  target:
    - nsis
    - zip
nsis:
  artifactName: OfferStrike-Setup.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
